    tiers: [standard, flex, priority]
    tier_multipliers: {priority: 2.0}
    routes: [global, geo, in_region]
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-luna.html
    as_of: "2026-11-08"
  openai.gpt-oss-120b:
    label: OpenAI gpt-oss-120b (Bedrock)
    aliases: [gpt-oss-120b]
    rates: {input: 0.15, cached: 0.15, cache_write: 0.15, output: 0.60}
    tiers: [standard, flex, priority, batch]
    routes: [in_region]
    route_multipliers: {in_region: 1.0}
    source: https://aws.amazon.com/bedrock/pricing/
    as_of: "2026-04-30"
