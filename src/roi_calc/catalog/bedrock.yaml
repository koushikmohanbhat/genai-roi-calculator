  agentcore_runtime_v2: {vcpu_hour: 0.1276, gb_hour: 0.0169, source: "https://aws.amazon.com/bedrock/agentcore/pricing/", as_of: "2026-09-18", notes: ["Active CPU only; memory billed per second, reclaimed after 120 s idle."]}
  agentcore_runtime_v1: {vcpu_hour: 0.0895, gb_hour: 0.00945, source: "https://aws.amazon.com/bedrock/agentcore/pricing/", as_of: "2026-07-04"}
  agentcore_gateway: {per_1k_invocations: 0.005, source: "https://aws.amazon.com/bedrock/agentcore/pricing/", as_of: "2026-10-01"}
  agentcore_memory: {per_1k_short_term_events: 0.25, per_1k_long_term_records: 0.75, source: "https://aws.amazon.com/bedrock/agentcore/pricing/", as_of: "2026-08-06", verify: true}
  guardrails: {content_filter: 0.15, denied_topics: 0.15, sensitive_info: 0.10, grounding: 0.10, unit: "per 1,000 text units (up to 1,000 characters each)", source: "https://aws.amazon.com/about-aws/whats-new/2024/12/amazon-bedrock-guardrails-reduces-pricing-85-percent", as_of: "2026-10-11"}
