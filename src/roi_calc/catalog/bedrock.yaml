# Amazon Bedrock list prices (US Regions), USD per 1M tokens, plus AgentCore and Guardrails run costs.
# Refresh from the Bedrock pricing page and model cards; every change needs a source and date.
# `verify: true` marks rates taken from third-party write-ups that should be checked against AWS before use.
provider: bedrock
label: Amazon Bedrock
currency: USD
as_of: "2026-11-08"
source: https://aws.amazon.com/bedrock/pricing/
notes:
  - "Global cross-Region inference is the base rate; in-Region and geographic (e.g. US) cross-Region inference add 10% for OpenAI and Anthropic models."
  - "OpenAI models on Bedrock are priced at OpenAI's first-party rates with Global cross-Region inference."
  - "Service tiers: Flex is 50% off Standard; Priority is a 75% premium for most models and 2x for OpenAI models. Support is per model."
  - "Batch inference is 50% off on-demand for selected models. Prompt caching is not supported with batch."
routes:
  global: {multiplier: 1.0, label: "Global cross-Region inference"}
  geo: {multiplier: 1.1, label: "Geographic cross-Region inference (e.g. US)"}
  in_region: {multiplier: 1.1, label: "In-Region"}
tiers:
  standard: {multiplier: 1.0, label: "Standard"}
  flex: {multiplier: 0.5, label: "Flex"}
  priority: {multiplier: 1.75, label: "Priority"}
  batch: {multiplier: 0.5, label: "Batch inference"}
long_context: {threshold_tokens: 272000, input: 2.0, cached: 2.0, cache_write: 2.0, output: 1.5}
models:
  openai.gpt-6-astra:
    label: OpenAI GPT-6 Astra (Bedrock)
    aliases: [global.openai.gpt-6-astra, us.openai.gpt-6-astra, gpt-6-astra]
    rates: {input: 10.00, cached: 1.00, cache_write: 12.50, output: 50.00}
    tiers: [standard]
    routes: [global, geo, in_region]
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-astra.html
    as_of: "2026-11-08"
    notes: ["Priority and Flex are not supported for Astra (model card)."]
  openai.gpt-6.1-sol:
    label: OpenAI GPT-6.1 Sol (Bedrock)
    aliases: [global.openai.gpt-6.1-sol, us.openai.gpt-6.1-sol, gpt-6.1-sol]
    rates: {input: 2.00, cached: 0.10, cache_write: 2.50, output: 10.00}
    tiers: [standard, flex, priority]
    tier_multipliers: {priority: 2.0}
    routes: [global, geo, in_region]
    source: https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-openai-gpt-6-1-sol.html
    also: https://aws.amazon.com/marketplace/pp/prodview-capzsh5hl5u5y
    as_of: "2026-11-08"
  openai.gpt-6.1-terra:
    label: OpenAI GPT-6.1 Terra (Bedrock)
    aliases: [global.openai.gpt-6.1-terra, us.openai.gpt-6.1-terra, gpt-6.1-terra]
    rates: {input: 1.00, cached: 0.05, cache_write: 1.25, output: 5.00}
    tiers: [standard, flex, priority]
    tier_multipliers: {priority: 2.0}
    routes: [global, geo, in_region]
    source: https://aws.amazon.com/about-aws/whats-new/2026/10/openai-gpt-6-1-terra-on-amazon-bedrock/
    as_of: "2026-11-08"
    verify: true
    notes: ["Global rate equals OpenAI's; in-Region / geographic is $1.10 / $5.50. Flex and Priority support assumed as for Sol: check the model card."]
  openai.gpt-6-luna:
    label: OpenAI GPT-6 Luna (Bedrock)
    aliases: [global.openai.gpt-6-luna, us.openai.gpt-6-luna, gpt-6-luna]
